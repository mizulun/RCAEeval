name: Build and test

on:
  push:
    branches: [ "main", "dev", "v2", "lag-*", "merit"]
  pull_request:
    branches: [ "main", "dev", "v2", "lag-*", "merit"]

jobs:
  build-and-test-default:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y build-essential libxml2 libxml2-dev zlib1g-dev python3-tk graphviz libjpeg-dev zlib1g-dev
        python -m pip install .[default]

    - name: Test
      run: python -m pytest tests/test.py tests/test_parser* tests/test_merit.py
