name: Check PR Title

on:
  pull_request:
    branches: [merit]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|perf|refactor|test|build|ci|chore|revert)(\([a-zA-Z0-9][a-zA-Z0-9._/-]*\))?!?: [^[:space:]].*$'
          if [[ "$PR_TITLE" == *$'\n'* || "$PR_TITLE" == *$'\r'* || ! "$PR_TITLE" =~ $pattern ]]; then
            printf '%s\n' '::error::Use type: description or type(scope): description; an optional ! marks a breaking change. Types: feat, fix, docs, perf, refactor, test, build, ci, chore, revert.'
            exit 1
          fi
          printf '%s\n' 'PR title format is valid.'
